services:
  # Service Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notification-backend
    # ports:
    #   - "3001:3001"  # Port API REST
    #   - "5023:5023"  # Port WebSocket natif
    # environment:
    #   - NODE_ENV=development
    #   - PORT=3001
    #   - WS_PORT=5023
    volumes:
      - backend_data:/app/data
      - backend_data:/app/notifications.db
    networks:
      - notification-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-frontend
    # ports:
    #   - "3000:3000"  # Port par défaut pour le développement
    # environment:
    #   - NODE_ENV=development
    #   - NEXT_PUBLIC_API_URL=http://localhost:3001
    #   - NEXT_PUBLIC_WS_URL=ws://localhost:3001
    depends_on:
      - backend
    networks:
      - notification-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_data:

networks:
  notification-network:
    driver: bridge
