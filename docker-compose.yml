services:
  # Service Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notification-backend
    ports:
      - "5022:3001"  # Port host:port container
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - backend_data:/app/data
      - ./backend/notifications.db:/app/notifications.db
    networks:
      - notification-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-frontend
    ports:
      - "5020:3000"  # Port host:port container
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://69.197.142.189:5022
      - NEXT_PUBLIC_WS_URL=ws://69.197.142.189:5022
    depends_on:
      - backend
    networks:
      - notification-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_data:

networks:
  notification-network:
    driver: bridge
